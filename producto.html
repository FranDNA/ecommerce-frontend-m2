<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Detalle de producto de TiendAmbiente." />
    <title>TiendAmbiente | Detalle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="detail">
    <header>
      <nav
        class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm"
        aria-label="Navegación principal"
      >
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">TiendAmbiente</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="carrito.html">Carrito</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contacto">Contacto</a>
              </li>
              <li class="nav-item">
                <a
                  class="btn btn-light text-success fw-semibold ms-lg-2"
                  href="carrito.html"
                >
                  Carrito
                  <span
                    id="cart-count"
                    class="badge text-bg-warning ms-1"
                    aria-live="polite"
                    >0</span
                  >
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="py-5">
      <section class="container">
        <a class="btn btn-outline-success mb-4" href="index.html"
          >Volver al catálogo</a
        >
        <article
          id="product-detail"
          class="row g-4 align-items-center"
        ></article>
      </section>
    </main>

    <footer id="contacto" class="bg-dark text-light py-4 mt-auto">
      <div class="container d-md-flex justify-content-between">
        <p class="mb-1 mb-md-0">TiendAmbiente - Datos ficticios.</p>
        <p class="mb-0">contacto@tiendambiente.info</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
